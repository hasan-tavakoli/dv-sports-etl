# filepath: dbt/models/public/_schema.yml
version: 2

models:
  - name: daily_revenue_summary
    description: "Aggregates total daily revenue and daily active paying users from raw transaction data."
    columns:
      - name: revenue_date
        description: "The date of the transactions."
        tests:
          - not_null
      - name: total_daily_revenue
        description: "The sum of transaction amounts for the given day."
      - name: daily_active_paying_users
        description: "The count of unique users who made a purchase on the given day."