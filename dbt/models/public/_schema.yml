# filepath: dbt/models/public/_schema.yml
version: 2

models:
  - name: daily_revenue_summary
    description: "Aggregates total daily revenue from raw event data."
    columns:
      - name: revenue_date
        description: "The date of the revenue recording."
        tests:
          - not_null
      - name: total_daily_revenue
        description: "The sum of all revenue amounts for the specific day."